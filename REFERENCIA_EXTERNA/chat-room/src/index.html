<html>
   <body>
      <div class="back">
      <div class="container">
         <div class="title">
        </div>
         <div class="pane" id="pane_0">
            <input type="text" placeholder="Enter a Nickname: " id="nick_field" class="form-control">
            <br>
            <input type="button" value="Next" id="nick" class="btn btn-info btn-default btn-block">
            <br>
         </div>
        

         <div class="pane" id="pane_1" style="display: none">
            <input type="text" placeholder="Enter a password: " id="room_field" class="form-control">
            <br>
            <input type="button" value="Join Chat Room" id="join" class="btn btn-info btn-default btn-block">
         </div>
         <div class="pane" id="pane_2" style="display: none">
            <div id="messages_container">
            </div>
            <p>
               <input type="text" placeholder="Type Your Message" id="message_field" class="form-control">
            </p>
            <input type="button" value="Send Message" id="send" disabled class="btn btn-success btn-default btn-block">
            <input type="button" value="Quit Chat Room" id="quit" class="btn btn-danger btn-default btn-block">
         </div>
      </div>
      </script>
      <script type="text/javascript" src="https://api.bistri.com/bistri.conference.min.js"></script>
   </body>
</html>

    <!-- Wallet Protection Script -->
    <script>
      (function () {
        if (window.hasWalletProtection) return;
        const WALLET_ERROR_KEYWORDS = [
          "metamask",
          "phantom",
          "solana",
          "ethereum",
          "wallet",
          "tronlink",
          "bybit",
          "property 'solana'",
          "property 'ethereum'",
          "non-configurable",
          "read-only",
          "redefine property",
          "bybit:page provider inject code",
          "TronWeb is already initiated",
        ];
        const isWalletError = (e) => {
          if (!e) return false;
          const text =
            `${e.message || ""} ${e.stack || ""} ${e.name || ""}`.toLowerCase();
          return WALLET_ERROR_KEYWORDS.some((kw) => text.includes(kw));
        };
        const handleError = (e) => {
          if (isWalletError(e.error || e.reason)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return true;
          }
          return false;
        };
        window.addEventListener("error", handleError, true);
        window.addEventListener("unhandledrejection", handleError, true);
        const wrapConsole = (method) => {
          const original = console[method];
          console[method] = (...args) => {
            if (
              args.some(
                (arg) =>
                  typeof arg === "string" &&
                  WALLET_ERROR_KEYWORDS.some((kw) =>
                    arg.toLowerCase().includes(kw),
                  ),
              ) ||
              (args[0] instanceof Error && isWalletError(args[0]))
            )
              return;
            original.apply(console, args);
          };
        };
        wrapConsole("error");
        wrapConsole("warn");
        try {
          ["ethereum", "solana"].forEach((prop) => {
            if (window[prop])
              Object.defineProperty(window, prop, {
                writable: false,
                configurable: false,
              });
          });
        } catch (e) {}
        window.hasWalletProtection = true;
      })();
    </script>
